# dsh-md-annotator bundle patch
#
# Mounted through `dsh plugin --profile web add file:vendor/dsh-md-annotator-<version>.tgz`.
# The official CLI reconciles dsh.profile.bundles from this dsh.bundle.patch
# declaration. The row id must stay unique in the composition. The node half is
# responsible for version-checked saves; the client registers a file viewer
# with the separately installed dsh-better-sidebar service.
- insert:
    - id: md-annotator
      name: 'dsh-md-annotator'
